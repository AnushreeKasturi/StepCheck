[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stepcheck"
version = "0.1.0"
description = "Find the exact step where a math solution goes wrong"
requires-python = ">=3.12"
dependencies = [
    "sympy==1.14.*",
    "antlr4-python3-runtime==4.11.*",  # must match the ANTLR version SymPy's LaTeX grammar was built with
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy"]
# Local handwriting OCR. rapidocr is pinned because cnstd (a Pix2Text dependency) imports a
# function that rapidocr 3.10 renamed.
ocr = ["pix2text==1.1.7", "rapidocr==3.9.2"]

[tool.setuptools.packages.find]
include = ["stepcheck*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["stepcheck"]

[[tool.mypy.overrides]]
module = ["sympy.*", "antlr4.*", "pix2text.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:sympy.*"]
